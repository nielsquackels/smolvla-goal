[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smolvla-goal"
version = "0.1.0"
description = "Goal-conditioned SmolVLA: target image conditioning for HuggingFace's SmolVLA policy"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Niels Quackels" }
]
dependencies = [
    "lerobot",
    "torch",
]

[tool.setuptools.packages.find]
include = ["smolvla_goal*"]